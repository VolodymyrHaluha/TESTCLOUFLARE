<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask сайт</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    main {
      max-width: 720px;
      padding: 40px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #2563eb;
    }

    code {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #e5edff;
      color: #1d4ed8;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Вітаємо на Flask сайті</h1>
    <p>Це звичайна стартова сторінка <strong>index.html</strong>, яку можна запускати через Flask-сервер.</p>
    <p>Очікувана адреса сайту: <code>http://192.168.0.1:5000</code></p>
  </main>
</body>
</html>
